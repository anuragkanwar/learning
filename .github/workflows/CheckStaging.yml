name: Check Staging

on:
  push:
    branches: [master]


jobs:
  prod:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check Dump
      run: |
          ls
          pwd
          cat ./docs/go/language/link-here.md
          cat "${{ github.ref }}"

